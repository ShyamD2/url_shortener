<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}URL Shortener{% endblock %}</title>
<style>
    :root {
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #334155;
        --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 40px 16px;
    }
    .container { width: 100%; max-width: 640px; }
    h1 {
        font-size: 1.8rem;
        margin-bottom: 4px;
        text-align: center;
    }
    p.subtitle {
        text-align: center;
        color: var(--muted);
        margin-top: 0;
        margin-bottom: 28px;
    }
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
    }
    form { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 8px; }
    input[type=text], input[type=url] {
        flex: 1;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0f172a;
        color: var(--text);
        font-size: 0.95rem;
    }
    input::placeholder { color: var(--muted); }
    button {
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.95rem;
        transition: background 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    .error {
        color: var(--danger);
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.3);
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 0.9rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 600; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .original { color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; }
    .empty { color: var(--muted); text-align: center; padding: 20px 0; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
    {% block content %}{% endblock %}
    <footer>Built with Flask + SQLite</footer>
</div>
</body>
</html>
